<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locator Pilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="header-title">Locator Pilot</span>
      <button id="options-link" class="link-btn" type="button">Options</button>
    </header>

    <section class="section">
      <button id="pick-btn" class="primary-btn" type="button">Pick an element</button>
      <p class="hint">Click, then hover the page and click any element.</p>
    </section>

    <section class="section">
      <label for="paste-input" class="label">Paste a locator to find it on the page</label>
      <textarea
        id="paste-input"
        rows="3"
        placeholder="e.g. page.getByRole('button', { name: 'Submit' })"
      ></textarea>
      <button id="find-btn" class="primary-btn" type="button">Find on page</button>
      <p id="find-result" class="find-result" role="status"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
