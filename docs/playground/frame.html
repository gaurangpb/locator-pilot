<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground frame</title>
    <style>
      body {
        margin: 0;
        padding: 14px 16px;
        font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #182036;
        color: #e8ecf3;
      }
      label { display: block; margin-bottom: 8px; }
      input { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a4566; background: #0f1424; color: inherit; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #2dd4af; background: transparent; color: #2dd4af; cursor: pointer; }
    </style>
  </head>
  <body>
    <label>Coupon code <input type="text" name="coupon" /></label>
    <button type="button" data-testid="apply-coupon">Apply coupon</button>
  </body>
</html>
