<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locator Pilot — marquee promo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1400px;
        height: 560px;
        overflow: hidden;
        background: radial-gradient(1200px 500px at 70% 50%, #1b2748 0%, #0f1424 58%);
      }
      .row {
        height: 560px;
        display: flex;
        align-items: center;
        padding: 0 96px;
        gap: 72px;
        box-sizing: border-box;
      }
      .mark {
        width: 220px;
        height: 220px;
        border-radius: 48px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
        flex-shrink: 0;
      }
      .panel {
        flex: 1;
        max-width: 820px;
        height: 360px;
        border-radius: 18px;
        background: #141a2e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        padding: 22px;
        box-sizing: border-box;
        font: 20px/1.4 "Segoe UI", sans-serif;
        color: #e8ecf3;
      }
      .chip {
        display: inline-block;
        background: rgba(45, 212, 175, 0.18);
        color: #6fe3c9;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .code {
        margin-top: 18px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 12px;
        padding: 16px 18px;
        font: 22px/1.45 Consolas, "SFMono-Regular", monospace;
        color: #d8f0ff;
      }
      .muted {
        margin-top: 16px;
        color: #9aa3b8;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <img class="mark" src="/icons/icon128.png" alt="" />
      <div class="panel">
        <span class="chip">robust · 1 match</span>
        <div class="code">page.getByRole('button', { name: 'Submit transfer' })</div>
        <p class="muted">Ranked Playwright locators in C# and TypeScript.</p>
      </div>
    </div>
  </body>
</html>
