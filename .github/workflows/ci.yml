name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: E2E tests against dist/
        run: npx playwright test
      - name: Pack store zip
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: locator-pilot-zip
          path: locator-pilot.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
